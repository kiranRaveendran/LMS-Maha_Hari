<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS (root-relative — always resolves regardless of folder depth) -->
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <!-- Tailwind — scoped to the dashboard content section only,
         preflight disabled so it can't touch the Bootstrap-based shell -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false }
        };
    </script>

    <style>
        #dashboardStats, #dashboardStats * {
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>

<body>

<template id="page-content-source">

<div id="dashboardStats" class="max-w-7xl mx-auto">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h2 class="text-2xl font-semibold text-gray-900 m-0">Welcome back, <span id="facultyName">—</span></h2>
            <p id="lastUpdated" class="text-sm text-gray-500 mt-1 mb-0">Last updated: —</p>
        </div>

        <button id="refreshDashboardBtn"
            class="inline-flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200">
            <i class="bi bi-arrow-clockwise refresh-icon text-base"></i>
            Refresh
        </button>
    </div>

    <!-- Profile strip -->
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm mb-6 flex flex-wrap items-center gap-6">
        <div class="h-14 w-14 rounded-full bg-violet-50 flex items-center justify-center shrink-0">
            <i class="bi bi-person-circle text-violet-600 text-3xl"></i>
        </div>
        <div class="flex flex-wrap gap-x-10 gap-y-2">
            <div>
                <p class="text-xs text-gray-400 mb-0 uppercase tracking-wide">Email</p>
                <p class="text-sm text-gray-800 mb-0" id="facultyEmail">—</p>
            </div>
            <div>
                <p class="text-xs text-gray-400 mb-0 uppercase tracking-wide">Employee ID</p>
                <p class="text-sm text-gray-800 mb-0" id="facultyEmployeeId">—</p>
            </div>
        </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-10">

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-amber-50 flex items-center justify-center mb-4">
                <i class="bi bi-book-half text-amber-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="courseCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Courses</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-blue-50 flex items-center justify-center mb-4">
                <i class="bi bi-mortarboard text-blue-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="studentCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Students</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-emerald-50 flex items-center justify-center mb-4">
                <i class="bi bi-clipboard-check text-emerald-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="assignmentCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Assignments</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-rose-50 flex items-center justify-center mb-4">
                <i class="bi bi-journal-richtext text-rose-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="materialCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Learning Materials</p>
        </div>

    </div>

    <!-- Stage 8 — integrated summary stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-10">

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-orange-50 flex items-center justify-center mb-4">
                <i class="bi bi-hourglass-split text-orange-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="pendingGradingCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Pending Grading</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-teal-50 flex items-center justify-center mb-4">
                <i class="bi bi-calendar2-check text-teal-600 text-xl"></i>
            </div>
            <div class="text-3xl font-semibold text-gray-900" id="attendancePercent">—</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Attendance This Month</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-indigo-50 flex items-center justify-center mb-4">
                <i class="bi bi-bar-chart-line text-indigo-600 text-xl"></i>
            </div>
            <div class="text-3xl font-semibold text-gray-900" id="averageMarks">—</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Average Marks</p>
        </div>

    </div>

    <!-- Courses + Quick Actions -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

        <div class="lg:col-span-2 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
            <h3 class="text-base font-semibold text-gray-900 mb-4 mt-0">My Courses</h3>
            <div id="courseList" class="flex flex-col gap-1">
                <!-- populated by faculty-dashboard.js -->
            </div>
        </div>

        <div class="lg:col-span-1 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
            <h3 class="text-base font-semibold text-gray-900 mb-4 mt-0">Quick Links</h3>
            <div class="flex flex-col gap-1">
                <a href="/faculty/learning-materials.html"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                    <i class="bi bi-journal-richtext text-gray-400"></i>
                    Learning Materials
                </a>
                <a href="/faculty/assignments.html"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                    <i class="bi bi-clipboard-check text-gray-400"></i>
                    Assignments
                </a>
                <a href="/faculty/attendance.html"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                    <i class="bi bi-calendar2-check text-gray-400"></i>
                    Attendance
                </a>
                <a href="/faculty/marks.html"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                    <i class="bi bi-bar-chart-line text-gray-400"></i>
                    Marks
                </a>
                <a href="/faculty/leave-history.html"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                    <i class="bi bi-calendar-check text-gray-400"></i>
                    Leave Management
                </a>
            </div>
        </div>

    </div>

</div>

</template>

<script src="/js/faculty-layout.js"></script>
<script>
    renderFacultyLayout({ pageTitle: "Dashboard", active: "dashboard" });
</script>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/faculty-dashboard.js"></script>

</body>

</html>
