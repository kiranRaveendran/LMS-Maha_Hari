<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Manager Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS (root-relative — always resolves regardless of folder depth) -->
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">

    <!-- Tailwind — scoped to the dashboard content section only,
         preflight disabled so it can't touch the Bootstrap-based shell -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false }
        };
    </script>

    <style>
        #dashboardStats, #dashboardStats * {
            font-family: 'Inter', sans-serif;
        }
    </style>

</head>

<body>

<template id="page-content-source">

<div id="dashboardStats" class="max-w-7xl mx-auto">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h2 class="text-2xl font-semibold text-gray-900 m-0">Academic Manager Dashboard</h2>
            <p class="text-sm text-gray-500 mt-1 mb-0">Batches, courses, enrollments and faculty allocation, all in one place.</p>
        </div>
    </div>

    <!-- Stats cards — backed by /api/academic-manager/dashboard/ -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-10">

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-amber-50 flex items-center justify-center mb-4">
                <i class="bi bi-book text-amber-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="courseCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Courses</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-blue-50 flex items-center justify-center mb-4">
                <i class="bi bi-diagram-3 text-blue-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="batchCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Batches</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-emerald-50 flex items-center justify-center mb-4">
                <i class="bi bi-people text-emerald-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="enrollmentCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Enrollments</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-indigo-50 flex items-center justify-center mb-4">
                <i class="bi bi-person-workspace text-indigo-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="facultyCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Faculty</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-rose-50 flex items-center justify-center mb-4">
                <i class="bi bi-mortarboard text-rose-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="studentCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Students</p>
        </div>

        <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
            <div class="h-11 w-11 rounded-xl bg-orange-50 flex items-center justify-center mb-4">
                <i class="bi bi-hourglass-split text-orange-600 text-xl"></i>
            </div>
            <div class="stat-skeleton animate-pulse h-8 w-16 bg-gray-100 rounded"></div>
            <div class="stat-value hidden text-3xl font-semibold text-gray-900" id="pendingLeaveCount">0</div>
            <p class="text-sm text-gray-500 mt-1 mb-0">Pending Leave Requests</p>
        </div>

    </div>

    <!-- Quick Links — all root-relative, matching ACADEMIC_MANAGER_NAV_ITEMS
         in academic-manager-layout.js exactly (previously pointed at a
         nonexistent /manager/ folder with relative, non-rooted paths) -->
    <div class="rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
        <h3 class="text-base font-semibold text-gray-900 mb-4 mt-0">Quick Links</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <a href="/academic-manager/batches.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-diagram-3 text-gray-400"></i>
                Batch Management
            </a>
            <a href="/academic-manager/courses.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-book text-gray-400"></i>
                Course Management
            </a>
            <a href="/academic-manager/enrollment.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-people text-gray-400"></i>
                Student Enrollment
            </a>
            <a href="/academic-manager/enrollment.html#allocation"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-person-check text-gray-400"></i>
                Faculty Allocation
            </a>
            <a href="/academic-manager/syllabus.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-journal-text text-gray-400"></i>
                Syllabus
            </a>
            <a href="/academic-manager/announcements.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-megaphone text-gray-400"></i>
                Announcements
            </a>
            <a href="/academic-manager/leave-approvals.html"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-gray-700 no-underline hover:bg-gray-50 transition-colors">
                <i class="bi bi-calendar-check text-gray-400"></i>
                Leave Approvals
            </a>
        </div>
    </div>

</div>

</template>

<script src="/js/academic-manager-layout.js"></script>
<script>
    renderAcademicManagerLayout({ pageTitle: "Dashboard", active: "dashboard" });
</script>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/academic-manager-common.js"></script>
<script src="/js/academic-manager-dashboard.js"></script>

</body>

</html>
