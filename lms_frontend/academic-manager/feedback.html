<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Feedback | LMS Academic Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">

</head>

<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3 class="fw-bold mb-1">Student Feedback</h3>
                    <p class="text-muted mb-0">Concerns and feedback submitted by students.</p>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <select id="statusFilter" class="form-select">
                        <option value="">All</option>
                        <option value="pending">Awaiting response</option>
                        <option value="responded">Responded</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div id="feedbackList"></div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <p class="text-muted small mb-0" id="showingRangeText">Showing 0 of 0</p>
                <nav id="feedbackPagination"></nav>
            </div>

        </div>
    </div>
</div>

<!-- Respond Modal -->
<div class="modal fade" id="respondModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="respondForm">
        <div class="modal-header">
          <h5 class="modal-title">Respond to Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="respondFeedbackId">
          <p class="text-muted small mb-1">From <strong id="respondStudentName"></strong>:</p>
          <p class="border rounded p-2 bg-light" id="respondOriginalMessage"></p>
          <div class="mb-2 mt-3">
            <label class="form-label">Your Response</label>
            <textarea class="form-control" id="respondText" rows="4" required></textarea>
          </div>
          <div class="text-danger small" id="respondFormError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveRespondBtn">Send Response</button>
        </div>
      </form>
    </div>
  </div>
</div>

</template>

<script src="/js/academic-manager-layout.js"></script>
<script>
    renderAcademicManagerLayout({ pageTitle: "Student Feedback", active: "feedback" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/pagination.js"></script>
<script src="/js/academic-manager-common.js"></script>
<script src="/js/academic-manager-feedback.js"></script>

</body>

</html>
