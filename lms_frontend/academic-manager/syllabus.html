<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Syllabus | LMS Academic Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">

</head>

<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-5">
                    <h3 class="fw-bold mb-1">Syllabus</h3>
                    <p class="text-muted mb-0">Create topics, allocate them to a course, and track completion.</p>
                </div>
                <div class="col-md-4 mt-3 mt-md-0">
                    <select class="form-select" id="courseSelect">
                        <option value="">— Select a course —</option>
                    </select>
                </div>
                <div class="col-md-3 mt-3 mt-md-0 text-md-end">
                    <button class="btn btn-primary" id="openCreateTopicBtn" disabled>
                        <i class="bi bi-plus-lg me-1"></i> New Topic
                    </button>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div id="noCourseSelected" class="text-center text-muted py-5">
                <i class="bi bi-journal-text fs-1"></i><br><br>
                Select a course above to view or manage its syllabus.
            </div>

            <div id="syllabusContent" class="d-none">

                <div class="d-flex align-items-center justify-content-between mb-3">
                    <p class="text-muted small mb-0" id="progressText">0 of 0 topics completed</p>
                    <div class="progress flex-grow-1 mx-3" style="height: 8px;">
                        <div class="progress-bar bg-success" id="progressBar" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 90px;">Session</th>
                                <th>Topic</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="syllabusTableBody">
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>
</div>

<!-- Create/Edit Topic Modal -->
<div class="modal fade" id="topicModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="topicForm">
        <div class="modal-header">
          <h5 class="modal-title" id="topicModalTitle">New Topic</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="topicId">
          <div class="row">
            <div class="col-4 mb-3">
              <label class="form-label">Session #</label>
              <input type="number" min="1" class="form-control" id="topicSessionNumber" required>
            </div>
            <div class="col-8 mb-3">
              <label class="form-label">Topic Name</label>
              <input type="text" class="form-control" id="topicName" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="topicStatus">
              <option value="PENDING">Pending</option>
              <option value="COMPLETED">Completed</option>
            </select>
          </div>
          <div class="text-danger small" id="topicFormError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveTopicBtn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteTopicModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Delete Topic</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-0">This can't be undone.</p>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteTopicBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

</template>

<script src="/js/academic-manager-layout.js"></script>
<script>
    renderAcademicManagerLayout({ pageTitle: "Syllabus", active: "syllabus" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/pagination.js"></script>
<script src="/js/academic-manager-common.js"></script>
<script src="/js/academic-manager-syllabus.js"></script>

</body>

</html>
