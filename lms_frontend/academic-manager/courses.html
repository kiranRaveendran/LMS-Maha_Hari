<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management | LMS Academic Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">

</head>

<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3 class="fw-bold mb-1">Courses</h3>
                    <p class="text-muted mb-0">Each batch offering of a course gets its own row here.</p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-primary" id="openCreateCourseBtn">
                        <i class="bi bi-plus-lg me-1"></i> New Course
                    </button>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search by name, code, or faculty...">
                    </div>
                </div>
                <div class="col-lg-3">
                    <select class="form-select" id="batchFilter">
                        <option value="">All Batches</option>
                    </select>
                </div>
                <div class="col-lg-4">
                    <select class="form-select" id="facultyFilter">
                        <option value="">All Faculty</option>
                        <option value="unassigned">Unassigned Only</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Batch</th>
                            <th>Faculty</th>
                            <th>Enrolled</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="courseTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="text-muted">
                                    <div class="spinner-border text-primary mb-3"></div>
                                    <br>
                                    Loading Courses...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <p class="text-muted small mb-0" id="showingRangeText">Showing 0 of 0</p>
                <nav id="coursesPagination"></nav>
            </div>

        </div>
    </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal fade" id="courseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="courseForm">
        <div class="modal-header">
          <h5 class="modal-title" id="courseModalTitle">New Course</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="courseId">
          <div class="row">
            <div class="col-7 mb-3">
              <label class="form-label">Course Name</label>
              <input type="text" class="form-control" id="courseName" required>
            </div>
            <div class="col-5 mb-3">
              <label class="form-label">Code</label>
              <input type="text" class="form-control" id="courseCode" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="courseDescription" rows="2"></textarea>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Batch</label>
              <select class="form-select" id="courseBatch">
                <option value="">— None —</option>
              </select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Faculty</label>
              <select class="form-select" id="courseFaculty">
                <option value="">— Unassigned —</option>
              </select>
            </div>
          </div>
          <div class="text-danger small" id="courseFormError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveCourseBtn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reassign Faculty Modal — lighter-weight allocation action, doesn't
     touch name/code/description/batch, uses the dedicated
     assign-faculty endpoint rather than a full course PATCH -->
<div class="modal fade" id="reassignFacultyModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Reassign Faculty</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <p class="text-muted mb-1 small">Course</p>
          <p class="fw-bold mb-0" id="reassignCourseLabel">—</p>
        </div>
        <div class="mb-3">
          <label class="form-label">Faculty</label>
          <select class="form-select" id="reassignFacultySelect">
            <option value="">— Unassigned —</option>
          </select>
        </div>
        <div class="text-danger small" id="reassignFacultyError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveReassignFacultyBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteCourseModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title">Delete Course</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-0">This also removes every student enrollment tied to this course. This can't be undone.</p>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteCourseBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

</template>

<script src="/js/academic-manager-layout.js"></script>
<script>
    renderAcademicManagerLayout({ pageTitle: "Course Management", active: "courses" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/pagination.js"></script>
<script src="/js/academic-manager-common.js"></script>
<script src="/js/academic-manager-courses.js"></script>

</body>

</html>
