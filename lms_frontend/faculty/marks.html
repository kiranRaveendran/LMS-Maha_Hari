<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Marks | LMS Faculty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <!-- Entry Interface -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-white border-0 py-4">
            <h3 class="fw-bold mb-1">Enter Exam Marks</h3>
            <p class="text-muted mb-0">Select a course and exam type to enter marks for the whole class.</p>
        </div>

        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Course</label>
                    <select id="courseSelect" class="form-control">
                        <option value="">Select a course...</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Exam Type</label>
                    <select id="examTypeSelect" class="form-control">
                        <option value="">Select exam type...</option>
                        <option value="INTERNAL">Internal</option>
                        <option value="MODEL">Model</option>
                        <option value="FINAL">Final</option>
                    </select>
                </div>
            </div>

            <div id="rosterContainer">
                <p class="text-muted text-center py-4">Select a course and exam type to load the roster.</p>
            </div>

            <div class="text-end mt-3" id="saveRosterWrapper" style="display:none;">
                <button id="saveRosterBtn" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Marks
                </button>
            </div>

        </div>
    </div>

    <!-- Records List -->
    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <h3 class="fw-bold mb-1">Marks Records</h3>
            <p class="text-muted mb-0">All recorded marks for the selected course.</p>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Student</th>
                            <th>Exam Type</th>
                            <th>Marks</th>
                            <th>Grade</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                Select a course above to see its marks records.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div id="successMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow" style="z-index:1055;">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span id="successText">Marks saved successfully.</span>
</div>

<!-- Edit Single Mark Modal -->
<div class="modal fade" id="editMarkModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Mark</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted mb-3" id="editMarkSubtitle">—</p>
                <input type="hidden" id="editMarkId">
                <div class="mb-3">
                    <label class="form-label">Marks (out of 100)</label>
                    <div class="d-flex align-items-center gap-3">
                        <input type="number" step="0.01" min="0" max="100" id="editMarkValue" class="form-control" style="max-width:150px;">
                        <span id="editMarkGradePreview" class="badge bg-secondary">—</span>
                    </div>
                    <div class="text-danger small mt-1" id="editMarkError"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="editMarkSaveBtn">
                    <i class="bi bi-check-circle me-2"></i>
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
</template>

<script src="/js/faculty-layout.js"></script>
<script>
    renderFacultyLayout({ pageTitle: "Exam Marks", active: "marks" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/marks.js"></script>

</body>
</html>
