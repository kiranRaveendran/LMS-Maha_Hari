<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Materials | LMS Faculty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <!-- <link rel="stylesheet" href="/css/responsive.css"> -->
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3 class="fw-bold mb-1">Learning Materials</h3>
                    <p class="text-muted mb-0">Upload and manage materials for your courses.</p>
                </div>
                <div class="col-md-6 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-primary" id="addMaterialBtn">
                        <i class="bi bi-plus-circle me-2"></i>
                        Upload Material
                    </button>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Course</th>
                            <th>File</th>
                            <th>Uploaded</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <div class="text-muted">
                                    <div class="spinner-border text-primary mb-3"></div>
                                    <br>
                                    Loading Learning Materials...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div id="successMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow" style="z-index:1055;">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span id="successText">Material saved successfully.</span>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="materialModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Upload Material</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="materialForm">
                    <input type="hidden" id="materialId">

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="title" class="form-control">
                        <div class="text-danger small mt-1" id="titleError"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course</label>
                        <select id="course" class="form-control">
                            <option value="">Select a course...</option>
                        </select>
                        <div class="text-danger small mt-1" id="courseError"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">File</label>
                        <input type="file" id="file" class="form-control">
                        <small class="text-muted" id="fileHint">Required.</small>
                        <div class="text-danger small mt-1" id="fileError"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveMaterialBtn">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Material
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteMaterialModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">
                    <i class="bi bi-trash me-2"></i>
                    Delete Material
                </h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">Are you sure you want to delete this material?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>
</template>

<script src="/js/faculty-layout.js"></script>
<script>
    renderFacultyLayout({ pageTitle: "Learning Materials", active: "learning-materials" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/learning-materials.js"></script>

</body>
</html>
