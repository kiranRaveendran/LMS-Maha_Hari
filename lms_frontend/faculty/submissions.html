<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submissions | LMS Faculty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3 class="fw-bold mb-1">Submissions</h3>
                    <p class="text-muted mb-0">Review and grade student submissions.</p>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <select id="assignmentFilter" class="form-control">
                        <option value="">All Assignments</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Student</th>
                            <th>Assignment</th>
                            <th>File</th>
                            <th>Submitted</th>
                            <th>Grade</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submissionTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="text-muted">
                                    <div class="spinner-border text-primary mb-3"></div>
                                    <br>
                                    Loading Submissions...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div id="successMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow" style="z-index:1055;">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span id="successText">Grade saved successfully.</span>
</div>

<!-- Grade Modal -->
<div class="modal fade" id="gradeModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Grade Submission</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div class="mb-3">
                    <p class="text-muted mb-1 small">Student</p>
                    <p class="fw-bold mb-0" id="gradeStudentName">—</p>
                </div>

                <div class="mb-3">
                    <p class="text-muted mb-1 small">Assignment</p>
                    <p class="fw-bold mb-0" id="gradeAssignmentTitle">—</p>
                </div>

                <div class="mb-3">
                    <a id="gradeFileLink" href="#" target="_blank" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-file-earmark-arrow-down me-1"></i> View Submitted File
                    </a>
                </div>

                <form id="gradeForm">
                    <input type="hidden" id="submissionId">

                    <div class="mb-3">
                        <label class="form-label">Grade</label>
                        <input type="number" step="0.01" min="0" id="grade" class="form-control">
                        <div class="text-danger small mt-1" id="gradeError"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Feedback</label>
                        <textarea id="feedback" class="form-control" rows="4"></textarea>
                        <div class="text-danger small mt-1" id="feedbackError"></div>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="saveGradeBtn">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Grade
                </button>
            </div>
        </div>
    </div>
</div>
</template>

<script src="/js/faculty-layout.js"></script>
<script>
    renderFacultyLayout({ pageTitle: "Submissions", active: "submissions" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/submissions.js"></script>

</body>
</html>
