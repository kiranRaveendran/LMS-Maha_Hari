<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | LMS Faculty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <!-- Marking Interface -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-white border-0 py-4">
            <h3 class="fw-bold mb-1">Mark Attendance</h3>
            <p class="text-muted mb-0">Select a course and date to mark or update attendance.</p>
        </div>

        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Course</label>
                    <select id="courseSelect" class="form-control">
                        <option value="">Select a course...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Date</label>
                    <input type="date" id="dateInput" class="form-control">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="loadRosterBtn" class="btn btn-outline-primary w-100">
                        <i class="bi bi-arrow-repeat me-1"></i> Load
                    </button>
                </div>
            </div>

            <div id="rosterContainer">
                <p class="text-muted text-center py-4">Select a course and date, then click Load.</p>
            </div>

            <div class="text-end mt-3" id="saveRosterWrapper" style="display:none;">
                <button id="saveRosterBtn" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>
                    Save Attendance
                </button>
            </div>

        </div>
    </div>

    <!-- Monthly Calendar -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-white border-0 py-4">
            <h3 class="fw-bold mb-1">Monthly Overview</h3>
            <p class="text-muted mb-0">Visual attendance history for one student across a month.</p>
        </div>

        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label">Course</label>
                    <select id="calendarCourseSelect" class="form-control">
                        <option value="">Select a course...</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Student</label>
                    <select id="calendarStudentSelect" class="form-control">
                        <option value="">Select a course first...</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Month</label>
                    <input type="month" id="calendarMonthInput" class="form-control">
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <button id="loadCalendarBtn" class="btn btn-outline-primary w-100">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex gap-4 mb-3 small">
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#10b981;"></span> Present</div>
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#ef4444;"></span> Absent</div>
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#9ca3af;"></span> Weekend</div>
                <div><span class="d-inline-block rounded border" style="width:14px;height:14px;background:#fff;"></span> Not marked</div>
            </div>

            <div id="calendarContainer">
                <p class="text-muted text-center py-4">Select a course, student, and month, then click the refresh button.</p>
            </div>

        </div>
    </div>

</div>

<!-- Day Edit Modal (opened by clicking a calendar cell) -->
<div class="modal fade" id="dayEditModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dayEditTitle">Edit Attendance</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted mb-3" id="dayEditSubtitle">—</p>
                <div class="btn-group w-100 mb-3" role="group">
                    <input type="radio" class="btn-check" name="dayEditStatus" id="dayEditPresent" value="PRESENT">
                    <label class="btn btn-outline-success" for="dayEditPresent">Present</label>

                    <input type="radio" class="btn-check" name="dayEditStatus" id="dayEditAbsent" value="ABSENT">
                    <label class="btn btn-outline-danger" for="dayEditAbsent">Absent</label>
                </div>
                <div id="dayEditClearWrapper" style="display:none;">
                    <button id="dayEditClearBtn" class="btn btn-sm btn-link text-muted p-0">
                        <i class="bi bi-x-circle me-1"></i>Clear this record
                    </button>
                    <div id="dayEditClearConfirm" style="display:none;" class="mt-2 p-2 bg-light rounded d-flex align-items-center justify-content-between">
                        <span class="small text-muted">Remove this record?</span>
                        <div>
                            <button id="dayEditClearCancelBtn" class="btn btn-sm btn-outline-secondary me-2">Cancel</button>
                            <button id="dayEditClearConfirmBtn" class="btn btn-sm btn-danger">Yes, clear</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" id="dayEditSaveBtn">
                    <i class="bi bi-check-circle me-2"></i>
                    Save
                </button>
            </div>
        </div>
    </div>
</div>

<div id="successMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow" style="z-index:1055;">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span id="successText">Attendance saved successfully.</span>
</div>
</template>

<script src="/js/faculty-layout.js"></script>
<script>
    renderFacultyLayout({ pageTitle: "Attendance", active: "attendance" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/attendance.js"></script>

</body>
</html>
