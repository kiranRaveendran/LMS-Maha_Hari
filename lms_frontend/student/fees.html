<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees | LMS Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="row g-4">

        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-4">
                    <h5 class="fw-bold mb-1">Fee Balance</h5>
                    <p class="text-muted mb-0 small">Test payments only — no real money is charged.</p>
                </div>
                <div class="card-body">

                    <div id="feeLoading" class="text-center py-5">
                        <div class="spinner-border text-primary"></div>
                    </div>

                    <div id="feeContent" class="d-none">

                        <div class="text-center py-3">
                            <p class="text-muted mb-1">Amount Due</p>
                            <h2 class="fw-bold mb-2" id="feeAmount">Rs. 0</h2>
                            <span id="feeStatusBadge" class="badge"></span>
                        </div>

                        <button class="btn btn-primary w-100 mt-3" id="payNowBtn">
                            <i class="bi bi-credit-card me-2"></i>Pay Now
                        </button>

                        <p class="text-center text-muted small mt-3 mb-0" id="paidMessage" style="display: none;">
                            <i class="bi bi-check-circle-fill text-success me-1"></i>
                            Your fee has been paid in full.
                        </p>

                        <div class="text-danger small text-center mt-2" id="feeError"></div>

                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-4">
                    <h5 class="fw-bold mb-1">Payment History</h5>
                    <p class="text-muted mb-0 small">Every payment attempt, including failed ones.</p>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Date</th>
                                    <th>Razorpay Order ID</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="paymentsTableBody">
                                <tr>
                                    <td colspan="4" class="text-center py-5">
                                        <div class="spinner-border text-primary"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</template>

<script src="/js/student-layout.js"></script>
<script>
    renderStudentLayout({ pageTitle: "Fees", active: "fees" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>

<!-- Razorpay Checkout -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="/js/student-fees.js"></script>

</body>
</html>
