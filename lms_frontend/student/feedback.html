<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | LMS Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="row g-4">

        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-4">
                    <h5 class="fw-bold mb-1">Send Feedback</h5>
                    <p class="text-muted mb-0 small">Raise a concern or share feedback with an Academic Manager.</p>
                </div>
                <div class="card-body">
                    <form id="feedbackForm">
                        <div class="mb-3">
                            <label class="form-label">Send To</label>
                            <select class="form-select" id="academicManagerSelect" required>
                                <option value="">— Select —</option>
                            </select>
                            <div class="text-danger small mt-1" id="academicManagerError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" id="feedbackMessage" rows="5" maxlength="1000" required></textarea>
                            <div class="text-danger small mt-1" id="messageError"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submitFeedbackBtn">
                            <i class="bi bi-send me-2"></i>Send
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 py-4">
                    <h5 class="fw-bold mb-1">My Feedback</h5>
                    <p class="text-muted mb-0 small">What you've sent, and any responses.</p>
                </div>
                <div class="card-body">
                    <div id="feedbackHistoryList">
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</template>

<script src="/js/student-layout.js"></script>
<script>
    renderStudentLayout({ pageTitle: "Feedback", active: "feedback" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/student-feedback.js"></script>

</body>
</html>
