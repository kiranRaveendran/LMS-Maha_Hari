<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | LMS Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <!-- Monthly Calendar (read-only) -->
    <div class="card shadow-sm border-0 mb-4">

        <div class="card-header bg-white border-0 py-4">
            <h3 class="fw-bold mb-1">Attendance</h3>
            <p class="text-muted mb-0">Your monthly attendance history, by course.</p>
        </div>

        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-7">
                    <label class="form-label">Course</label>
                    <select id="calendarCourseSelect" class="form-control">
                        <option value="">Select a course...</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Month</label>
                    <input type="month" id="calendarMonthInput" class="form-control">
                </div>
            </div>

            <div class="row g-3 mb-3" id="statsRow" style="display:none;">
                <div class="col-md-3">
                    <div class="summary-stat">
                        <h5 class="fw-bold text-success mb-0" id="statPresent">0</h5>
                        <p class="text-muted small mb-0">Present</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-stat">
                        <h5 class="fw-bold text-danger mb-0" id="statAbsent">0</h5>
                        <p class="text-muted small mb-0">Absent</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-stat">
                        <h5 class="fw-bold mb-0" id="statMarked">0</h5>
                        <p class="text-muted small mb-0">Days Marked</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="summary-stat">
                        <h5 class="fw-bold text-primary mb-0" id="statPercentage">—</h5>
                        <p class="text-muted small mb-0">Attendance %</p>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-4 mb-3 small">
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#10b981;"></span> Present</div>
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#ef4444;"></span> Absent</div>
                <div><span class="d-inline-block rounded" style="width:14px;height:14px;background:#9ca3af;"></span> Weekend</div>
                <div><span class="d-inline-block rounded border" style="width:14px;height:14px;background:#fff;"></span> Not marked</div>
            </div>

            <div id="calendarContainer">
                <p class="text-muted text-center py-4">Select a course and month to view your attendance.</p>
            </div>

        </div>
    </div>

</div>

<style>
    .summary-stat {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        text-align: center;
    }
</style>

</template>

<script src="/js/student-layout.js"></script>
<script>
    renderStudentLayout({ pageTitle: "Attendance", active: "attendance" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/student-attendance.js"></script>

</body>
</html>
