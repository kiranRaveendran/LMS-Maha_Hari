<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests | LMS Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

<template id="page-content-source">
<div class="container-fluid">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white border-0 py-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h3 class="fw-bold mb-1">Leave Requests</h3>
                    <p class="text-muted mb-0">Requests submitted by Academic Managers.</p>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <select id="statusFilter" class="form-control">
                        <option value="">All Statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="APPROVED">Approved</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Academic Manager</th>
                            <th>Reason</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leaveTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="text-muted">
                                    <div class="spinner-border text-primary mb-3"></div>
                                    <br>
                                    Loading Requests...
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav id="leavePagination" class="d-flex justify-content-center mt-3"></nav>

        </div>
    </div>
</div>

<div id="successMessage" class="alert alert-success d-none position-fixed top-0 end-0 m-4 shadow" style="z-index:1055;">
    <i class="bi bi-check-circle-fill me-2"></i>
    <span id="successText">Updated successfully.</span>
</div>
</template>

<script src="/js/layout.js"></script>
<script>
    renderLayout({ pageTitle: "Leave Requests", active: "leave-requests" });
</script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/pagination.js"></script>
<script src="/js/admin-leave-requests.js"></script>

</body>
</html>
